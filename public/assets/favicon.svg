<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="NC A&T Chemistry favicon">
  <!-- Aggie-blue tile (sharp, on-theme) -->
  <rect width="32" height="32" fill="#004684"/>
  <!-- benzene ring -->
  <g fill="none" stroke="#FDB927" stroke-width="2" stroke-linejoin="round">
    <polygon points="16,5 25,10.5 25,21.5 16,27 7,21.5 7,10.5"/>
    <!-- inner double-bond hints -->
    <line x1="16" y1="9" x2="22" y2="12.5" stroke-width="1.4"/>
    <line x1="22" y1="12.5" x2="22" y2="19.5" stroke-width="1.4"/>
    <line x1="16" y1="23" x2="10" y2="19.5" stroke-width="1.4"/>
  </g>
  <!-- gold bond node -->
  <circle cx="16" cy="16" r="2.6" fill="#FDB927"/>
</svg>
