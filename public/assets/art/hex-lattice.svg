<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="Hexagonal molecular lattice art">
  <rect width="520" height="420" fill="#004684"/>
  <g fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2">
    <g id="hx">
      <polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/>
    </g>
  </g>
  <!-- repeated lattice -->
  <g fill="none" stroke="rgba(255,255,255,.16)" stroke-width="2">
    <g transform="translate(0,0)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(80,46)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(160,0)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(240,46)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(0,132)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(80,178)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(160,132)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(240,178)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
    <g transform="translate(320,132)"><polygon points="60,60 100,38 140,60 140,104 100,126 60,104"/></g>
  </g>
  <!-- highlighted gold hexagon + bonds -->
  <g>
    <polygon points="220,170 260,148 300,170 300,214 260,236 220,214" fill="none" stroke="#FDB927" stroke-width="3.5"/>
    <circle cx="260" cy="192" r="6" fill="#FDB927"/>
    <circle cx="260" cy="148" r="5" fill="#FDB927"/><circle cx="300" cy="170" r="5" fill="#FDB927"/>
    <circle cx="300" cy="214" r="5" fill="#FDB927"/><circle cx="260" cy="236" r="5" fill="#FDB927"/>
    <circle cx="220" cy="214" r="5" fill="#FDB927"/><circle cx="220" cy="170" r="5" fill="#FDB927"/>
  </g>
</svg>
