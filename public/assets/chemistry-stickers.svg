<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" font-family="'Space Grotesk',sans-serif">
  <style>
    .cell{fill:#ffffff;stroke:#e3e6ea;stroke-width:1}
    .blue{stroke:#004684;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .gold{stroke:#FDB927;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .goldf{fill:#FDB927}.bluef{fill:#004684}
    .lbl{fill:#6c7480;font-size:13px;letter-spacing:.04em;text-transform:uppercase;text-anchor:middle}
  </style>

  <!-- 1. Erlenmeyer flask -->
  <rect class="cell" x="10" y="10" width="180" height="180"/>
  <g transform="translate(100,95)">
    <path class="blue" d="M -16,-45 L -16,-18 L -40,38 A8,8 0 0 0 -33,50 L 33,50 A8,8 0 0 0 40,38 L 16,-18 L 16,-45"/>
    <line class="blue" x1="-22" y1="-45" x2="22" y2="-45"/>
    <path class="goldf" d="M -27,12 L 27,12 L 33,38 A8,8 0 0 1 26,50 L -26,50 A8,8 0 0 1 -33,38 Z" opacity=".85"/>
    <circle class="goldf" cx="0" cy="-2" r="3.5"/><circle class="goldf" cx="-12" cy="2" r="2.5"/><circle class="goldf" cx="12" cy="4" r="2.5"/>
  </g>
  <text class="lbl" x="100" y="178">Flask</text>

  <!-- 2. Test tube -->
  <rect class="cell" x="200" y="10" width="180" height="180"/>
  <g transform="translate(290,90)">
    <path class="blue" d="M -12,-48 L -12,40 A12,12 0 0 0 12,40 L 12,-48"/>
    <line class="blue" x1="-18" y1="-48" x2="18" y2="-48"/>
    <path class="goldf" d="M -12,6 L 12,6 L 12,40 A12,12 0 0 1 -12,40 Z" opacity=".85"/>
    <circle class="goldf" cx="0" cy="20" r="3"/><circle class="goldf" cx="-5" cy="30" r="2"/>
  </g>
  <text class="lbl" x="290" y="178">Test tube</text>

  <!-- 3. Benzene ring -->
  <rect class="cell" x="390" y="10" width="180" height="180"/>
  <g transform="translate(480,92)">
    <polygon class="blue" points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24"/>
    <polygon class="gold" points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" stroke-width="4"/>
    <circle class="goldf" cx="0" cy="0" r="5"/>
  </g>
  <text class="lbl" x="480" y="178">Benzene ring</text>

  <!-- 4. Atom -->
  <rect class="cell" x="580" y="10" width="190" height="180"/>
  <g transform="translate(675,92)">
    <ellipse class="blue" cx="0" cy="0" rx="50" ry="20"/>
    <ellipse class="blue" cx="0" cy="0" rx="50" ry="20" transform="rotate(60)"/>
    <ellipse class="blue" cx="0" cy="0" rx="50" ry="20" transform="rotate(120)"/>
    <circle class="goldf" cx="0" cy="0" r="8"/>
    <circle class="bluef" cx="50" cy="0" r="4"/>
  </g>
  <text class="lbl" x="675" y="178">Atom</text>

  <!-- 5. Molecule (node-bond) -->
  <rect class="cell" x="10" y="200" width="375" height="70"/>
  <g transform="translate(120,235)">
    <line class="blue" x1="-70" y1="0" x2="-20" y2="-14" stroke-width="4"/>
    <line class="gold" x1="-20" y1="-14" x2="40" y2="6" stroke-width="4"/>
    <line class="blue" x1="40" y1="6" x2="95" y2="-10" stroke-width="4"/>
    <circle class="bluef" cx="-70" cy="0" r="7"/><circle class="goldf" cx="-20" cy="-14" r="9"/>
    <circle class="bluef" cx="40" cy="6" r="7"/><circle class="goldf" cx="95" cy="-10" r="7"/>
  </g>
  <text class="lbl" x="197" y="262">Molecular bonds</text>

  <!-- 6. Hex grid -->
  <rect class="cell" x="395" y="200" width="375" height="70"/>
  <g transform="translate(500,235)" class="gold" stroke-width="3">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/>
    <polygon points="38,-22 57,-11 57,11 38,22 19,11 19,-11" stroke="#004684"/>
    <polygon points="76,-22 95,-11 95,11 76,22 57,11 57,-11"/>
  </g>
  <text class="lbl" x="582" y="262">Hex lattice</text>
</svg>
